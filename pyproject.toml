[project]
name = "trustworthyai"
version = "0.2.0"
description = "A Python package for interpretable and trustworthy machine learning"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]